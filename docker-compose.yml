services:

  mysql:
    image: mysql:8.4
    container_name: laivy-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-sistema_esportivo}
    ports:
      # 3307 no host pra não brigar com um MySQL local já rodando na 3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    container_name: laivy-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/${DB_NAME:-sistema_esportivo}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-28800000}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/laivy-assistente
      - N8N_TOKEN=${N8N_TOKEN}
    ports:
      - "8080:8080"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: laivy-n8n
    depends_on:
      - qdrant
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - WEBHOOK_URL=http://localhost:5678
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: laivy-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mysql_data:
  n8n_data:
  qdrant_data:
