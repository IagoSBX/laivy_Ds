<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biblioteca de jogadas · LAIVY</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/laivy-theme.css">
  <link rel="stylesheet" href="css/prancheta.css">
</head>
<body>

<div id="sidebar-placeholder"></div>
<script src="js/sidebar.js"></script>

<!-- MAIN -->
<main class="main">

  <div class="page-header">
    <div>
      <h1>Biblioteca de Jogadas</h1>
      <p>Jogadas salvas do time, prontas pra reaproveitar em qualquer treino ou jogo.</p>
    </div>
    <a id="link-nova" class="btn btn-primario" href="#">+ Nova jogada</a>
  </div>

  <div class="barra-filtros">
    <input id="busca" class="campo campo-busca" type="search"
           placeholder="Buscar por nome…" autocomplete="off">
    <select id="filtro-tipo" class="campo campo-tipo" aria-label="Filtrar por tipo">
      <option value="">Todos os tipos</option>
    </select>
  </div>

  <div id="grade" class="grade-biblioteca">
    <p class="ajuda">Carregando jogadas…</p>
  </div>

  <div class="rodape-biblioteca">
    <button id="btn-carregar-mais" type="button" class="btn" hidden>Carregar mais</button>
  </div>

</main>

<!-- ASSISTENTE LAIVY -->
<a href="assistente.html" id="iaBotao" class="ia-fab" title="Assistente LAIVY" aria-label="Abrir assistente LAIVY">🤖</a>

<script type="module" src="js/prancheta/biblioteca.js"></script>
</body>
</html>
